[package]
name = "invoice-maturity-reminder"
version = "0.1.0"
edition = "2021"
publish = false
description = "StellarSettle invoice maturity reminder contract — emits structured alert events at configurable intervals before invoice maturity"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
